[experiment]
name = "onnx_baseline_test_public"
out_dir = "experiments"

[data]
csv = "data/test_public.csv"
root = "."
filepath_col = "filepath"
chunk_seconds = 6.0

[encoder]
type = "onnx"
model_path = "models/baseline.onnx"
providers = ["CUDAExecutionProvider", "CPUExecutionProvider"]
output_name = "embeddings"

[index]
backend = "faiss_ip"
topk = 10

[evaluation]
ks = [1, 5, 10]
