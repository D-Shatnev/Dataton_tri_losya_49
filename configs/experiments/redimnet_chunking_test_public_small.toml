[experiment]
name    = "redimnet_chunking_test_public_small"
out_dir = "experiments"

[data]
# dataset_type = "csv_raw" yields raw waveforms; ChunkingEncoder handles segmentation.
# Run with: speakerid-experiment --config ... --batch-size 1
csv            = "data/test_public_small_fragment.csv"
root           = "data"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0       # unused by csv_raw loader, kept for validator
dataset_type   = "csv_raw"

[encoder]
type             = "redimnet"
model_path       = ""
model_name       = "b6"
train_type       = "ft_lm"
dataset          = "vox2"
device           = "auto"
embedding_dim    = 192
force_reload     = false
# Chunking: 4s chunks with 2s overlap → Simple Average Pooling
chunk_duration_s = 4.0
chunk_overlap_s  = 2.0
sample_rate      = 16000

[loader]
type      = "soundfile"
target_sr = 16000
clip      = false

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
