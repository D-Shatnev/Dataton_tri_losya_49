[experiment]
name    = "redimnet_chunking_test_public"
out_dir = "experiments"

[data]
# dataset_type = "csv_raw" yields raw waveforms; ChunkingEncoder handles segmentation.
# ChunkingEncoder batches chunks from all files in the batch into a single GPU call.
# Run with: speakerid-experiment --config ... --batch-size 32
csv            = "data/test_public.csv"
root           = "data"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0       # unused by csv_raw loader, kept for validator
dataset_type   = "csv_raw"

[encoder]
type             = "redimnet"
model_path       = ""
model_name       = "b6"
train_type       = "ft_lm"
dataset          = "vox2"
device           = "auto"
embedding_dim    = 192
force_reload     = false
# Chunking: 4s chunks with 2s overlap → Simple Average Pooling
chunk_duration_s  = 4.0
chunk_overlap_s   = 2.0
sample_rate       = 16000
# Upper bound on audio duration in the dataset.
# Used to pre-compute a fixed padded_total so torch.compile always sees the
# same tensor shape and never recompiles mid-run (eliminates "ryvki").
# Set to 0.0 to fall back to auto-detect from the first batch.
max_audio_duration_s = 120.0
# Maximum number of chunks passed to the GPU in a single call.
# Limits peak VRAM usage when batch_size * max_chunks_per_file is large.
# 32 chunks × 64000 samples × float16 ≈ 4 MB — safe for any GPU.
max_chunk_batch   = 32

[loader]
type      = "soundfile"
target_sr = 16000
clip      = false

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
