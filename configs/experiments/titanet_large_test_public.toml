[experiment]
name    = "titanet_large_test_public"
out_dir = "experiments"

[data]
csv            = "/mnt/sda/dataton/datasets/test_public.csv"
root           = "/mnt/sda/dataton/datasets"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0

[encoder]
# HuggingFace model ID — downloaded automatically on first run (~200 MB).
# To use a local .nemo checkpoint instead, set model_path to its absolute path.
type       = "titanet"
model_path = "nvidia/speakerverification_en_titanet_large"
# providers repurposed as device hint for TitaNet:
#   ["cuda"] → GPU inference
#   ["cpu"]  → CPU inference
#   absent   → auto-detect (CUDA if available, else CPU)
# providers = ["cuda"]

[loader]
type      = "soundfile"
target_sr = 16000
clip      = false

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
# labels_npy = "/mnt/sda/dataton/datasets/labels.npy"  # if speaker_id absent in CSV
