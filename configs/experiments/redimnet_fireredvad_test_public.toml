[experiment]
name    = "redimnet_fireredvad_test_public"
out_dir = "experiments"

[data]
csv            = "data/test_public.csv"
root           = "data"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0

[encoder]
type          = "redimnet"
model_path    = ""
model_name    = "b6"
train_type    = "ft_lm"
dataset       = "vox2"
device        = "auto"
embedding_dim = 192
force_reload  = false

[loader]
type            = "soundfile"
target_sr       = 16000
clip            = false
prefetch_factor = 8

[vad]
type             = "fireredvad"
model_dir        = "models/FireRedVAD/VAD"
use_gpu          = true
speech_threshold = 0.4
min_speech_frame = 20

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
