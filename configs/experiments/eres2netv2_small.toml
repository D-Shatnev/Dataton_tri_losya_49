[experiment]
name    = "eres2netv2_small"
out_dir = "experiments"

[data]
csv            = "data/test_public_small_fragment.csv"
root           = "data"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0

[encoder]
type       = "camplusplus"
model_path = ""
model_id   = "iic/speech_eres2netv2_sv_zh-cn_16k-common"
device     = "auto"   # "auto" -> CUDA if available, else CPU

[loader]
type      = "soundfile"
target_sr = 16000
clip      = false

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
