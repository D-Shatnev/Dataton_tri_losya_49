[experiment]
name    = "ecapa_wavlm_joint_test_public"
out_dir = "experiments"

[data]
csv            = "data/test_public.csv"
root           = "data"
filepath_col   = "filepath"
speaker_id_col = "speaker_id"
chunk_seconds  = 6.0

[encoder]
type      = "espnet"
model_tag = "espnet/voxcelebs12_ecapa_wavlm_joint"
# model_path  = "models/ecapa_wavlm_joint.pth"   # alternative: local checkpoint
# train_config = "models/ecapa_wavlm_joint.yaml"  # required when model_path is set

[loader]
type      = "soundfile"
target_sr = 16000
clip      = false

[index]
backend = "faiss_ip"
topk    = 10

[evaluation]
type = "precision_at_k"
ks   = [1, 5, 10]
