[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Dataton_tri_losya_49"
version = "0.0.1"
description = "A project for speaker recognition by voice, resistant to various distortions."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.4.4",
    "pandas>=2.2.3",
    "onnxruntime-gpu==1.20.2",
    "faiss-cpu==1.13.2",
    "scipy>=1.17.1",
    "soundfile==0.12.1",
    "tqdm>=4.66",
    "fireredvad[gpu]>=0.0.2",
    "funasr>=1.2.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # TorchInductor / torch.compile runtime requirements:
    #   ninja     — parallel C++/Triton kernel compilation (significantly faster than make)
    #   setuptools — required to build generated C++ extensions at runtime
    #   psutil    — helps Inductor tune thread counts for the current machine
    "ninja>=1.11",
    "setuptools>=70",
    "psutil>=5.9",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/hackathonsrus/Dataton_tri_losya_49"
Repository = "https://github.com/hackathonsrus/Dataton_tri_losya_49.git"

[project.scripts]
speakerid-infer = "dataton_tri_losya_49.cli.infer:main"
speakerid-experiment = "dataton_tri_losya_49.cli.experiment:main"

[project.optional-dependencies]
dev = ["pylint==4.0.5", "pytest>=8.3", "ruff>=0.9"]
notebooks = ["nbformat==5.10.4", "plotly==6.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint]
max-line-length = 120
disable = "W0707, R0903, W0718, W1404, R0902"

# ---------------------------------------------------------------------------
# PyTorch CUDA index — only cu124 supports Python 3.13 (cp313) on linux_x86_64.
# torch 2.6.0+cu124 and torchaudio 2.6.0+cu124 are the latest available builds.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchaudio = [{ index = "pytorch-cu124" }]
