[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Dataton_tri_losya_49"
version = "0.0.1"
description = "A project for speaker recognition by voice, resistant to various distortions."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.4.4",
    "pandas>=2.2.3",
    "onnxruntime-gpu==1.20.2",
    "faiss-cpu==1.13.2",
    "scipy>=1.17.1",
    "soundfile==0.12.1",
    "tqdm>=4.66",
    "av>=17.0.0",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/hackathonsrus/Dataton_tri_losya_49"
Repository = "https://github.com/hackathonsrus/Dataton_tri_losya_49.git"

[project.scripts]
speakerid-infer = "dataton_tri_losya_49.cli.infer:main"
speakerid-experiment = "dataton_tri_losya_49.cli.experiment:main"

[project.optional-dependencies]
dev = ["pylint==4.0.5", "pytest>=8.3", "ruff>=0.9"]
notebooks = ["nbformat==5.10.4", "plotly==6.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint]
max-line-length = 120
disable = "W0707, R0903, W0718, W1404, R0902"
