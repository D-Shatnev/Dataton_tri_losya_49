# Speaker Recognition pipeline — Docker Compose
#
# Prerequisites on host:
#   - Docker Engine >= 24
#   - nvidia-container-toolkit (for GPU access)
#
# Build image once:
#   docker compose build
#
# Run inference (defaults to data/test_public.csv -> data/submission.csv):
#   docker compose run --rm infer
#
# Run inference on a custom CSV:
#   CSV_PATH=data/test_public2.csv OUT_PATH=data/sub2.csv docker compose run --rm infer
#
# Run experiment:
#   docker compose run --rm experiment
#
# Run experiment with custom config:
#   EXPERIMENT_CONFIG=configs/experiments/my_exp.toml docker compose run --rm experiment

name: speakerid

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  image: speakerid:chunking_aggregation
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [ gpu ]
  environment:
    NVIDIA_VISIBLE_DEVICES: all
  volumes:
    - /mnt/sda/dataton/datasets:/app/data
    - /mnt/sda/dataton/models:/app/models
    - ./configs:/app/configs

services:
  infer:
    <<: *base
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
      CSV_PATH: ${CSV_PATH:-data/test_public.csv}
      OUT_PATH: ${OUT_PATH:-data/submission.csv}
      ROOT_PATH: ${ROOT_PATH:-data}
    command:
      - speakerid-infer
      - --csv
      - ${CSV_PATH:-data/test_public.csv}
      - --out
      - ${OUT_PATH:-data/submission.csv}
      - --root
      - ${ROOT_PATH:-data}

  experiment:
    <<: *base
    volumes:
      - /mnt/sda/dataton/datasets:/app/data
      - /mnt/sda/dataton/models:/app/models
      - ./configs:/app/configs
      - ./experiments:/app/experiments
      # Persistent inductor/triton kernel cache — avoids recompilation on every run.
      # The compiled kernels are tied to the GPU arch and PyTorch version, so the
      # cache is safe to reuse across runs on the same machine.
      - inductor_cache:/root/.cache/torch
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
      EXPERIMENT_CONFIG: ${EXPERIMENT_CONFIG:-configs/experiments/onnx_baseline_test_public.toml}
      BATCH_SIZE: ${BATCH_SIZE:-32}
      PREFETCH: ${PREFETCH:-16}
      # Persist inductor compiled kernels across container restarts.
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torch/inductor
      # Reduce CUDA allocator fragmentation for large variable-size batches.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    command:
      - speakerid-experiment
      - --config
      - ${EXPERIMENT_CONFIG:-configs/experiments/onnx_baseline_test_public.toml}
      - --batch-size
      - ${BATCH_SIZE:-32}
      - --prefetch
      - ${PREFETCH:-16}

volumes:
  # Named volume for torch.inductor / triton compiled kernel cache.
  # Persists across container restarts so the model is only compiled once
  # per GPU architecture + PyTorch version combination.
  inductor_cache:
