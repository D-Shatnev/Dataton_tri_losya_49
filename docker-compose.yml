# Speaker Recognition pipeline — Docker Compose
#
# Prerequisites on host:
#   - Docker Engine >= 24
#   - nvidia-container-toolkit (for GPU access)
#
# Build image once:
#   docker compose build
#
# Run inference (defaults to data/test_public.csv -> data/submission.csv):
#   docker compose run --rm infer
#
# Run inference on a custom CSV:
#   CSV_PATH=data/test_public2.csv OUT_PATH=data/sub2.csv docker compose run --rm infer
#
# Run experiment:
#   docker compose run --rm experiment
#
# Run experiment with custom config:
#   EXPERIMENT_CONFIG=configs/experiments/my_exp.toml docker compose run --rm experiment

name: speakerid

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
    network: host
  image: speakerid:vad-redimnet-as-norm
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [ gpu ]
  environment:
    NVIDIA_VISIBLE_DEVICES: all
  volumes:
    - /mnt/disk/dataton/Dataton_tri_losya_49/data:/app/data
    - ./models:/app/models
    - ./configs:/app/configs

services:
  infer:
    <<: *base
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      CSV_PATH: ${CSV_PATH:-data/test_public.csv}
      OUT_PATH: ${OUT_PATH:-data/submission.csv}
      ROOT_PATH: ${ROOT_PATH:-data}
      TOPK: ${TOPK:-}
    command:
      - speakerid-infer
      - --csv
      - ${CSV_PATH:-data/test_public.csv}
      - --out
      - ${OUT_PATH:-data/submission.csv}
      - --root
      - ${ROOT_PATH:-data}
      - --k
      - ${TOPK:-10}
    network_mode: "host"

  experiment:
    <<: *base
    volumes:
      - /mnt/disk/dataton/Dataton_tri_losya_49/data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./experiments:/app/experiments
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-}
      EXPERIMENT_CONFIG: ${EXPERIMENT_CONFIG:-configs/experiments/onnx_baseline_test_public.toml}
      BATCH_SIZE: ${BATCH_SIZE:-1}
    command:
      - speakerid-experiment
      - --config
      - ${EXPERIMENT_CONFIG:-configs/experiments/onnx_baseline_test_public.toml}
      - --batch-size
      - ${BATCH_SIZE:-1}
    network_mode: "host"
